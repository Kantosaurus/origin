name: Docs
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  manpages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The hand-authored `docs/` tree is plain Markdown (rendered natively on
      # GitHub) — the previous `mdbook build docs/site` + GitHub Pages publish was
      # retired with the mdbook site. This job now just validates that the
      # generated manpages still build.
      - name: Build manpages
        run: cargo run -p xtask --locked -- manpages --out target/manpages
