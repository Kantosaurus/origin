name: Docs
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  manpages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The hand-authored `docs/` tree is plain Markdown (rendered natively on
      # GitHub) — the previous `mdbook build docs/site` + GitHub Pages publish was
      # retired with the mdbook site. This job now just validates that the
      # generated manpages still build.
      - name: Build manpages
        run: cargo run -p xtask --locked -- manpages --out target/manpages
