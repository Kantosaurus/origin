name: Unsafe audit
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsafe-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace sets `unsafe_code = "forbid"` in the root Cargo.toml's
      # [workspace.lints.rust], which the COMPILER enforces as a hard error for
      # every crate that inherits it via `[lints] workspace = true`. The only way
      # a crate can use `unsafe` is to inline its own [lints.rust] with
      # `unsafe_code = "allow"`. So auditing those overrides is a deterministic,
      # tool-independent equivalent of cargo-geiger — which broke on this virtual
      # workspace manifest ("requires running against an actual package") and is
      # not even needed here (the compiler already enforces the policy).
      - name: Assert unsafe_code override only in approved crates
        run: |
          python3 - <<'PY'
          import glob, re, sys
          # 1) The policy itself must be intact: the root workspace must still
          #    `forbid` unsafe (otherwise inheriting crates could use unsafe with
          #    no override for this audit to catch).
          root = open("Cargo.toml", encoding="utf-8").read()
          if not re.search(r'^\s*unsafe_code\s*=\s*"forbid"', root, re.M):
              sys.exit("FAIL: root [workspace.lints.rust] unsafe_code = \"forbid\" is missing")
          # 2) Crates with a documented `// SAFETY:`-disciplined need for unsafe.
          #    Adding a crate here is a deliberate review point.
          ALLOWED = {
              "origin-alloc",     # global allocator (jemalloc) glue
              "origin-cas",       # mmap + atomic cursors
              "origin-keyvault",  # platform secret-store FFI
              "origin-sandbox",   # seccomp / landlock syscalls
              "origin-stream",    # raw cursor atomics
              "origin-tui",       # SIMD (wide::u8x32)
          }
          offenders = []
          for path in sorted(glob.glob("crates/*/Cargo.toml")):
              text = open(path, encoding="utf-8").read()
              m = re.search(r'^\s*name\s*=\s*"([^"]+)"', text, re.M)
              name = m.group(1) if m else path
              if re.search(r'^\s*unsafe_code\s*=\s*"(allow|warn)"', text, re.M):
                  if name not in ALLOWED:
                      offenders.append(name)
          if offenders:
              print("FAIL: unsafe_code override found outside the approved allowlist:",
                    offenders, file=sys.stderr)
              print("If a crate legitimately needs unsafe, add it to ALLOWED in "
                    ".github/workflows/unsafe-audit.yml (a deliberate review point).",
                    file=sys.stderr)
              sys.exit(1)
          print("OK: unsafe_code override confined to", sorted(ALLOWED))
          PY
