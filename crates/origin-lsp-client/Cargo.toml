[package]
name = "origin-lsp-client"
description = "Minimal stdio JSON-RPC Language Server client for diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Test-only stand-in for a language server, driven by the integration tests via
# `CARGO_BIN_EXE_fake-lsp-server` so they need no real server installed.
[[bin]]
name = "fake-lsp-server"
path = "tests/fixtures/fake_lsp_server.rs"
test = false
bench = false
doc = false

[dependencies]
origin-sandbox = { path = "../origin-sandbox" }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
