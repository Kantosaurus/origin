[package]
name = "origin-provider-github"
description = "GitHub Copilot provider for origin with vault-sourced OAuth session tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
origin-keyvault = { path = "../origin-keyvault" }
origin-provider-openai-compat = { path = "../origin-provider-openai-compat" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
origin-core = { path = "../origin-core" }
origin-provider = { path = "../origin-provider" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
